<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ARISE Fitness</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header>
    <h1>⚔️ ARISE FITNESS</h1>
    <p id="rank">E-RANK HUNTER</p>
  </header>

  <main>

    <div class="player-card">

      <div class="player-top">
        <div>
          <div>LEVEL</div>
          <div class="level" id="level">1</div>
        </div>

        <div class="rank" id="rank">
          E-RANK HUNTER
        </div>
      </div>

      <div class="xp-container">

        <div class="xp-text">
          <span>XP</span>
          <span id="xpText">0 / 100 XP</span>
        </div>

        <div class="xp-bar">
          <div class="xp-fill" id="xpFill"></div>
        </div>

      </div>

    </div>

    <div class="stats">

      <div class="stat">
        <h3>TOTAL XP</h3>
        <p id="totalXp">0</p>
      </div>

      <div class="stat">
        <h3>WORKOUTS</h3>
        <p id="workouts">0</p>
      </div>

      <div class="stat">
        <h3>STREAK</h3>
        <p id="streak">0</p>
      </div>

    </div>

    <section>

      <h2>Today's Workout</h2>

      <div id="exerciseList"></div>

    </section>

    <div
      class="complete-box"
      id="completeBox"
    >

      <h2>⚔️ QUEST COMPLETE!</h2>

      <p>
        Workout completed successfully.
      </p>

      <button onclick="newWorkout()">
        START NEW WORKOUT
      </button>

    </div>

    <button
      class="reset-button"
      onclick="resetProgress()"
    >
      RESET PROGRESS
    </button>

  </main>

  <script src="js/storage.js"></script>
  <script src="js/workout.js"></script>
  <script src="js/app.js"></script>

</body>

</html>
